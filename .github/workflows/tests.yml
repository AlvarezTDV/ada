name: Offline tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADA_RUN_MODEL_EVALS: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: python -m pip install openai rich pyfiglet httpx
      - name: Run offline tests
        run: python -B scripts/run_tests.py --timeout 45
